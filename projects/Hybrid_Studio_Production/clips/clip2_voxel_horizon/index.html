<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hybrid Studio Clip 2: 67-Voxel Infinite Flight (67-Style Procedural 3D + p5 Warp + Anime.js)</title>
  <link rel="stylesheet" href="style.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
  <div id="video-container">
    <!-- Layer 1: Three.js 67-Voxel Procedural Horizon -->
    <div id="three-container"></div>
    
    <!-- Layer 2: p5.js Warp Speed Stars & Neon Horizon VFX -->
    <div id="p5-container"></div>
    
    <!-- Layer 3: Minimalist Cinematic UI Overlay -->
    <div id="hud-overlay">
      <header class="hud-header">
        <div class="hud-badge">
          <span class="status-dot"></span>
          <span class="badge-text">PROCEDURAL VOXEL HORIZON // 67.JS CORE</span>
        </div>
        <div class="hud-timecode" id="hud-timecode">00:00.00</div>
      </header>
      
      <main class="hud-center-text">
        <div class="hero-chip" id="hud-chip">ENVIRONMENT ENGINE</div>
        <h1 class="hero-title" id="hud-title">INFINITE HORIZON</h1>
        <p class="hero-subtitle" id="hud-sub">Lightweight procedural terrain streaming at 60 FPS</p>
      </main>
      
      <footer class="hud-footer">
        <div class="metrics-row">
          <div class="metric-item">
            <span class="m-label">GRID BLOCKS</span>
            <span class="m-val" id="val-blocks">24,500</span>
          </div>
          <div class="metric-item">
            <span class="m-label">STREAM SPEED</span>
            <span class="m-val" id="val-speed">1.0X</span>
          </div>
          <div class="metric-item">
            <span class="m-label">MEMORY FOOTPRINT</span>
            <span class="m-val">&lt; 18 MB</span>
          </div>
        </div>
        <div class="timeline-track">
          <div class="timeline-progress" id="timeline-progress"></div>
        </div>
      </footer>
      
      <div class="vignette"></div>
    </div>
  </div>

  <script src="sketch.js"></script>
</body>
</html>
